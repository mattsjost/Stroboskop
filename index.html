<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b3b3b">
<title>Strobe Tuner</title>
<!-- ChicagoFLF (Robin Casady, public domain): webbtypsnitt från fontlibrary.org, fungerar även på iPhone/Safari -->
<link rel="stylesheet" media="screen" href="https://fontlibrary.org//face/chicagoflf" type="text/css">
<!-- Reserv om ovanstående inte laddas: Pixelify Sans -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
  /* Valfritt och säkrast: lägg ChicagoFLF.woff2 eller ChicagoFLF.ttf bredvid denna fil, så används den i första hand */
  @font-face {
    font-family: "ChicagoFLFLocal";
    src: url("ChicagoFLF.woff2") format("woff2"),
         url("ChicagoFLF.ttf") format("truetype"),
         url("https://db.onlinewebfonts.com/t/53dc764fd0dbbb3140b7909afd437722.woff2") format("woff2"),
         url("https://db.onlinewebfonts.com/t/53dc764fd0dbbb3140b7909afd437722.woff") format("woff");
    font-weight: normal; font-style: normal; font-display: swap;
  }
  :root {
    --bg: #3b3b3b;
    --or: #f58a2d;
    --font: "ChicagoFLFLocal", "ChicagoFLFRegular", "Chicago", "ChicagoFLF", "Pixelify Sans", "Charcoal", "Geneva", monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--or); font-family: var(--font); font-weight: 400; }
  body {
    min-height: 100%; display: flex; justify-content: center;
    padding: max(8px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
    user-select: none; -webkit-user-select: none; -webkit-text-size-adjust: 100%;
  }
  /* Ritytan är 270 × 304 enheter; allt placeras i procent av den */
  .wrap { position: relative; width: 100%; max-width: 340px; aspect-ratio: 270 / 304; container-type: inline-size; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block;
           /* klipp bort allt till höger om kvadranten (8 av 270 enheter), oberoende av canvas-koden */
           -webkit-clip-path: inset(0 2.963% 0 0); clip-path: inset(0 2.963% 0 0); }
  button, input {
    font-family: var(--font); font-weight: 400; color: var(--or); background: transparent; border: none; border-radius: 0;
    cursor: pointer; padding: 0; margin: 0; -webkit-appearance: none; appearance: none;
  }
  button:focus-visible, input:focus-visible { outline: 2px solid #fff8; outline-offset: -3px; }

  .adj { position: absolute; left: 5.6%; width: 9.6%; height: 8.6%; font-size: 10cqw; line-height: 1; }
  #plus  { top: 3.6%; }
  #minus { top: 28.6%; }
  #refIn {
    position: absolute; left: 5.2%; top: 13.2%; width: 38.5%; height: 14.5%;
    font-size: 13.3cqw; text-align: left; padding-left: 1%; cursor: text; -moz-appearance: textfield;
  }
  #refIn::-webkit-outer-spin-button, #refIn::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  #start { position: absolute; left: 49.3%; top: 1.3%; width: 47.8%; height: 11.8%; font-size: 8.5cqw; letter-spacing: .5px; }
  #start.on { color: var(--bg); }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <canvas id="cv"></canvas>
  <button class="adj" id="plus" aria-label="Höj A-referens">+</button>
  <input id="refIn" type="number" inputmode="decimal" min="400" max="480" step="0.1" value="440" aria-label="A-referens i Hz">
  <button class="adj" id="minus" aria-label="Sänk A-referens">−</button>
  <button id="start">START</button>
</div>

<script>
(() => {
  const NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');
  const cs = getComputedStyle(document.documentElement);
  const OR = cs.getPropertyValue('--or').trim(), BG = cs.getPropertyValue('--bg').trim();
  const FONT = cs.getPropertyValue('--font').trim();

  /* ---------- Referens-A ---------- */
  let ref = 440;
  try { const s = parseFloat(localStorage.getItem('tunerRef')); if (s >= 400 && s <= 480) ref = s; } catch (e) {}
  const hist = [];
  function setRef(v) {
    v = Math.min(480, Math.max(400, Math.round(v * 10) / 10));
    ref = v; $('refIn').value = v;
    try { localStorage.setItem('tunerRef', v); } catch (e) {}
    hist.length = 0;
  }
  $('minus').onclick = () => setRef(ref - 1);
  $('plus').onclick = () => setRef(ref + 1);
  $('refIn').onchange = e => setRef(parseFloat(e.target.value) || 440);

  /* ---------- Ljud / tonhöjd ---------- */
  let actx = null, analyser, buf, stream = null, sr = 44100, running = false;
  let state = { active: false, lastSeen: 0, midi: 69, cents: 0, freq: 0, smooth: 0 };

  async function start() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
      });
      actx = new (window.AudioContext || window.webkitAudioContext)();
      await actx.resume();
      sr = actx.sampleRate;
      const src = actx.createMediaStreamSource(stream);
      const boost = actx.createGain(); boost.gain.value = 3;
      analyser = actx.createAnalyser(); analyser.fftSize = 4096;
      buf = new Float32Array(analyser.fftSize);
      src.connect(boost); boost.connect(analyser);
      const mute = actx.createGain(); mute.gain.value = 0;   // tyst utgång så grafen bearbetas
      analyser.connect(mute); mute.connect(actx.destination);
      running = true;
      $('start').textContent = 'STOP'; $('start').classList.add('on');
    } catch (err) {
      $('start').textContent = 'FEL';
      setTimeout(() => { $('start').textContent = 'START'; }, 2000);
    }
  }
  function stop() {
    running = false; state.active = false; hist.length = 0;
    if (stream) stream.getTracks().forEach(t => t.stop());
    if (actx) actx.close();
    stream = null; actx = null;
    $('start').textContent = 'START'; $('start').classList.remove('on');
  }
  $('start').onclick = () => running ? stop() : start();
  document.addEventListener('visibilitychange', () => { if (actx && actx.state === 'suspended') actx.resume(); });

  // YIN
  const W = 2048, dBuf = new Float32Array(W);
  function yin(x) {
    let rms = 0;
    for (let i = 0; i < W; i++) rms += x[i] * x[i];
    rms = Math.sqrt(rms / W);
    if (rms < 0.0015) return -1;
    const tauMax = Math.min(W - 1, Math.floor(sr / 60));
    const tauMin = Math.max(2, Math.floor(sr / 1400));
    dBuf[0] = 1; let run = 0;
    for (let tau = 1; tau <= tauMax; tau++) {
      let s = 0;
      for (let j = 0; j < W; j++) { const d = x[j] - x[j + tau]; s += d * d; }
      run += s;
      dBuf[tau] = run ? s * tau / run : 1;
    }
    let tau = -1;
    for (let t = tauMin; t < tauMax; t++) {
      if (dBuf[t] < 0.2) {
        while (t + 1 < tauMax && dBuf[t + 1] < dBuf[t]) t++;
        tau = t; break;
      }
    }
    if (tau < 0) {
      let best = tauMin;
      for (let t = tauMin; t < tauMax; t++) if (dBuf[t] < dBuf[best]) best = t;
      if (dBuf[best] > 0.4) return -1;
      tau = best;
    }
    if (tau <= 1 || tau >= tauMax) return -1;
    const a = dBuf[tau - 1], b = dBuf[tau], c = dBuf[tau + 1];
    const den = a + c - 2 * b;
    return sr / (tau + (den ? 0.5 * (a - c) / den : 0));
  }
  const median = a => [...a].sort((p, q) => p - q)[a.length >> 1];

  let lastDet = 0;
  function detect(now) {
    if (!running || now - lastDet < 40) return;
    lastDet = now;
    analyser.getFloatTimeDomainData(buf);
    const f = yin(buf);
    if (f > 0) {
      hist.push(f); if (hist.length > 5) hist.shift();
      const fm = hist.length >= 3 ? median(hist) : f;
      const n = 12 * Math.log2(fm / ref) + 69, m = Math.round(n), cents = (n - m) * 100;
      if (m !== state.midi) state.smooth = cents; else state.smooth += (cents - state.smooth) * 0.3;
      state.midi = m; state.cents = state.smooth; state.freq = fm;
      state.active = true; state.lastSeen = now;
    } else if (now - state.lastSeen > 600) {
      state.active = false; hist.length = 0;
    }
  }

  /* ---------- Geometri ----------
     Enhet u = bredd / 270; ritytan är 270 × 304 u.
     Stroboskopet är en kvartscirkel med mittpunkt i nedre högra hörnet (CX, CY).
     Ringens yttre kant ligger exakt på X_LEFT, och cirkelns högra tangent på X_RIGHT,
     så rutornas ytterkanter linjerar med stroboskopets mått. */
  const X_LEFT = 8, X_RIGHT = 262, H = 304;
  const CX = X_RIGHT, CY = H;
  const R_OUT = CX - X_LEFT;                 // 254
  const R_FRAME = R_OUT + 10;                // rutornas nedre kant följer denna båge
  const REF_BOX   = { x0: X_LEFT, x1: 125, top: 4 };
  const START_BOX = { x0: 133, x1: X_RIGHT, top: 4 };
  const OUTER = { r: R_OUT - 29, w: 58, n: 15, duty: 0.5  };   // 196–254
  const INNER = { r: 168,        w: 44, n: 30, duty: 0.65 };   // 146–190
  const LW = 3.4;                            // ramarnas linjetjocklek

  let phaseOuter = 0, phaseInner = 0, last = performance.now(), size = 0;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  function resize() {
    const r = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 3);
    size = r.width;
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);

  // Ruta: rak topp och raka sidor, nedre kanten är cirkelbågen runt stroboskopet
  function boxPath(b, u, inset) {
    const x0 = b.x0 + inset, x1 = b.x1 - inset, top = b.top + inset;
    const yAt = x => CY - Math.sqrt(R_FRAME * R_FRAME - (CX - x) * (CX - x));
    const aAt = x => Math.atan2(yAt(x) - CY, x - CX);
    ctx.beginPath();
    ctx.moveTo(x0 * u, top * u);
    ctx.lineTo(x1 * u, top * u);
    ctx.lineTo(x1 * u, yAt(x1) * u);
    ctx.arc(CX * u, CY * u, R_FRAME * u, aAt(x1), aAt(x0), true);
    ctx.closePath();
  }

  function ring(u, g, phase, alpha, glow) {
    const seg = Math.PI * 2 / g.n;
    ctx.save();
    ctx.lineWidth = g.w * u; ctx.strokeStyle = OR; ctx.globalAlpha = alpha;
    if (glow) { ctx.shadowColor = OR; ctx.shadowBlur = 8 * u; }
    for (let i = 0; i < g.n; i++) {
      const a0 = phase + i * seg - Math.PI / 2;
      ctx.beginPath(); ctx.arc(CX * u, CY * u, g.r * u, a0, a0 + seg * g.duty); ctx.stroke();
    }
    ctx.restore();
  }

  /* Tonens placering: grundtonens bokstav har alltid samma plats, och # ritas mindre
     till höger om den. Största möjliga storlek beräknas så att hela tecknet (inklusive #)
     ryms inom R_SAFE från cirkelns mittpunkt och M enheter från höger- och nederkanten. */
  const SHARP_R = 0.55, GAP_EM = 0.05, M = 14, R_SAFE = 138;
  function toneLayout() {
    ctx.font = `400 100px ${FONT}`;
    let wb = 0;
    for (const ch of 'ABCDEFG') wb = Math.max(wb, ctx.measureText(ch).width);
    const mH = ctx.measureText('H'), mS = ctx.measureText('#');
    const cap = mH.actualBoundingBoxAscent || 70;
    const sa = mS.actualBoundingBoxAscent || cap;
    const wbE = wb / 100, capE = cap / 100;
    const swE = mS.width / 100 * SHARP_R, saE = sa / 100 * SHARP_R;
    const a = wbE + GAP_EM + swE, b = capE;
    const A = a * a + b * b, B = 2 * M * (a + b), C = 2 * M * M - R_SAFE * R_SAFE;
    const F = Math.min(130, (-B + Math.sqrt(B * B - 4 * A * C)) / (2 * A));
    const left = CX - M - F * a, bottom = CY - M, top = bottom - F * b;
    return {
      F, bottom,
      baseX: left + F * wbE / 2,
      sharpX: left + F * (wbE + GAP_EM),
      sharpY: top + F * saE
    };
  }

  function draw(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    detect(now);
    if (!size) resize();
    const u = size / 270;
    ctx.clearRect(0, 0, size, size * H / 270);

    const live = state.active, c = live ? state.cents : 0;
    if (live) {
      phaseOuter += clamp(c, -50, 50) * 2.4 * dt * Math.PI / 180;     // grov skala
      phaseInner += clamp(c, -12, 12) * 12 * dt * Math.PI / 180;      // fin skala
    }
    const inTune = live && Math.abs(c) < 2, alpha = live ? 1 : 0.3;

    // Rutor
    ctx.lineWidth = LW * u; ctx.strokeStyle = OR; ctx.lineJoin = 'miter';
    boxPath(REF_BOX, u, LW / 2); ctx.stroke();
    if (running) { boxPath(START_BOX, u, 0); ctx.fillStyle = OR; ctx.fill(); }
    else { boxPath(START_BOX, u, LW / 2); ctx.stroke(); }

    // Stroboskop: yttre grov och inre fin skala
    // Klipp stroboskopet till kvadranten: inget ritas till höger om X_RIGHT (och inget under nederkanten)
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, CX * u, CY * u); ctx.clip();
    ring(u, OUTER, phaseOuter, alpha, inTune);
    ring(u, INNER, phaseInner, alpha, inTune);
    if (inTune) {
      ctx.beginPath(); ctx.arc(CX * u, CY * u, 142 * u, 0, Math.PI * 2);
      ctx.fillStyle = OR; ctx.fill();
    }
    ctx.restore();

    // Ton: grundtonen centrerad på sin fasta plats, # mindre till höger
    const name = live ? NAMES[((state.midi % 12) + 12) % 12] : '–';
    const L = toneLayout();
    ctx.fillStyle = inTune ? BG : OR; ctx.globalAlpha = live ? 1 : 0.35;
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'center';
    ctx.font = `400 ${L.F * u}px ${FONT}`;
    ctx.fillText(name[0], L.baseX * u, L.bottom * u);
    if (name.length > 1) {
      ctx.textAlign = 'left';
      ctx.font = `400 ${L.F * SHARP_R * u}px ${FONT}`;
      ctx.fillText('#', L.sharpX * u, L.sharpY * u);
    }
    ctx.globalAlpha = 1;

    requestAnimationFrame(draw);
  }

  setRef(ref);
  const fontReady = document.fonts && document.fonts.load
    ? Promise.race([
        Promise.all([
          document.fonts.load('16px "ChicagoFLFLocal"').catch(() => {}),
          document.fonts.load('16px "ChicagoFLFRegular"').catch(() => {}),
          document.fonts.load('16px "Pixelify Sans"').catch(() => {})
        ]),
        new Promise(r => setTimeout(r, 2500))
      ])
    : Promise.resolve();
  fontReady.catch(() => {}).finally(() => { resize(); requestAnimationFrame(draw); });
})();
</script>
</body>
</html>
