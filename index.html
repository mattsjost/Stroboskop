<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b3b3b">
<title>Strobe Tuner</title>
<style>
  /* Chicago: lägg ChicagoFLF.woff2 (eller .ttf) bredvid filen, annars används systemets Chicago om den finns. */
  @font-face {
    font-family: "Chicago";
    src: local("Chicago"), local("ChicagoFLF"), local("Chicago_12"),
         url("ChicagoFLF.woff2") format("woff2"),
         url("ChicagoFLF.ttf") format("truetype");
    font-display: swap;
  }
  :root {
    --bg: #3b3b3b;
    --or: #f58a2d;
    --font: "Chicago", "ChicagoFLF", "Chicago_12", "Charcoal", "Geneva", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--or); font-family: var(--font); }
  body {
    min-height: 100%; display: flex; justify-content: center;
    padding: max(8px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
    user-select: none; -webkit-user-select: none;
  }
  .wrap { position: relative; width: 100%; max-width: 300px; aspect-ratio: 1; container-type: inline-size; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  button, input {
    font-family: var(--font); color: var(--or); background: transparent; border: none; border-radius: 0;
    cursor: pointer; padding: 0; margin: 0;
  }
  button:focus-visible, input:focus-visible { outline: 2px solid #fff8; outline-offset: -3px; }

  /* A-referens: ruta uppe till vänster (0–70 % bredd, 0–20 % höjd) */
  .ref { position: absolute; left: 32%; top: 0; width: 40%; height: 40%; display: flex; flex-direction: column; align-items: stretch; }
  .ref button { height: 22%; font-size: 10cqw; line-height: 1; }
  .ref input { width: 100%; height: 26%; text-align: center; font-size: 8cqw; cursor: text; -moz-appearance: textfield; }
  .ref input::-webkit-outer-spin-button, .ref input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  /* Start/Stopp: ruta uppe till höger (74–100 % bredd) */
  #start { position: absolute; right: 0; top: 0; width: 26%; height: 14%; font-size: 5.4cqw; }
  #start.on { color: var(--bg); }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <canvas id="cv"></canvas>
  <div class="ref">
    <button id="plus" aria-label="Höj A-referens">+</button>
    <input id="refIn" type="number" inputmode="decimal" min="400" max="480" step="0.1" value="440" aria-label="A-referens i Hz">
    <button id="minus" aria-label="Sänk A-referens">−</button>
  </div>
  <button id="start">Start</button>
</div>

<script>
(() => {
  const NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');
  const cs = getComputedStyle(document.documentElement);
  const OR = cs.getPropertyValue('--or').trim(), BG = cs.getPropertyValue('--bg').trim();
  const FONT = cs.getPropertyValue('--font').trim();

  /* ---------- Referens-A ---------- */
  let ref = 440;
  try { const s = parseFloat(localStorage.getItem('tunerRef')); if (s >= 400 && s <= 480) ref = s; } catch (e) {}
  const hist = [];
  function setRef(v) {
    v = Math.min(480, Math.max(400, Math.round(v * 10) / 10));
    ref = v; $('refIn').value = v;
    try { localStorage.setItem('tunerRef', v); } catch (e) {}
    hist.length = 0;
  }
  $('minus').onclick = () => setRef(ref - 1);
  $('plus').onclick = () => setRef(ref + 1);
  $('refIn').onchange = e => setRef(parseFloat(e.target.value) || 440);

  /* ---------- Ljud / tonhöjd ---------- */
  let actx = null, analyser, buf, stream = null, sr = 44100, running = false;
  let state = { active: false, lastSeen: 0, midi: 69, cents: 0, freq: 0, smooth: 0 };

  async function start() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
      });
      actx = new (window.AudioContext || window.webkitAudioContext)();
      await actx.resume();
      sr = actx.sampleRate;
      const src = actx.createMediaStreamSource(stream);
      const boost = actx.createGain(); boost.gain.value = 3;
      analyser = actx.createAnalyser(); analyser.fftSize = 4096;
      buf = new Float32Array(analyser.fftSize);
      src.connect(boost); boost.connect(analyser);
      const mute = actx.createGain(); mute.gain.value = 0;   // tyst utgång så grafen bearbetas
      analyser.connect(mute); mute.connect(actx.destination);
      running = true;
      $('start').textContent = 'Stopp'; $('start').classList.add('on');
    } catch (err) {
      $('start').textContent = 'Fel';
      setTimeout(() => { $('start').textContent = 'Start'; }, 2000);
    }
  }
  function stop() {
    running = false; state.active = false; hist.length = 0;
    if (stream) stream.getTracks().forEach(t => t.stop());
    if (actx) actx.close();
    stream = null; actx = null;
    $('start').textContent = 'Start'; $('start').classList.remove('on');
  }
  $('start').onclick = () => running ? stop() : start();
  document.addEventListener('visibilitychange', () => { if (actx && actx.state === 'suspended') actx.resume(); });

  // YIN
  const W = 2048, dBuf = new Float32Array(W);
  function yin(x) {
    let rms = 0;
    for (let i = 0; i < W; i++) rms += x[i] * x[i];
    rms = Math.sqrt(rms / W);
    if (rms < 0.0015) return -1;
    const tauMax = Math.min(W - 1, Math.floor(sr / 60));
    const tauMin = Math.max(2, Math.floor(sr / 1400));
    dBuf[0] = 1; let run = 0;
    for (let tau = 1; tau <= tauMax; tau++) {
      let s = 0;
      for (let j = 0; j < W; j++) { const d = x[j] - x[j + tau]; s += d * d; }
      run += s;
      dBuf[tau] = run ? s * tau / run : 1;
    }
    let tau = -1;
    for (let t = tauMin; t < tauMax; t++) {
      if (dBuf[t] < 0.2) {
        while (t + 1 < tauMax && dBuf[t + 1] < dBuf[t]) t++;
        tau = t; break;
      }
    }
    if (tau < 0) {
      let best = tauMin;
      for (let t = tauMin; t < tauMax; t++) if (dBuf[t] < dBuf[best]) best = t;
      if (dBuf[best] > 0.4) return -1;
      tau = best;
    }
    if (tau <= 1 || tau >= tauMax) return -1;
    const a = dBuf[tau - 1], b = dBuf[tau], c = dBuf[tau + 1];
    const den = a + c - 2 * b;
    return sr / (tau + (den ? 0.5 * (a - c) / den : 0));
  }
  const median = a => [...a].sort((p, q) => p - q)[a.length >> 1];

  let lastDet = 0;
  function detect(now) {
    if (!running || now - lastDet < 40) return;
    lastDet = now;
    analyser.getFloatTimeDomainData(buf);
    const f = yin(buf);
    if (f > 0) {
      hist.push(f); if (hist.length > 5) hist.shift();
      const fm = hist.length >= 3 ? median(hist) : f;
      const n = 12 * Math.log2(fm / ref) + 69, m = Math.round(n), cents = (n - m) * 100;
      if (m !== state.midi) state.smooth = cents; else state.smooth += (cents - state.smooth) * 0.3;
      state.midi = m; state.cents = state.smooth; state.freq = fm;
      state.active = true; state.lastSeen = now;
    } else if (now - state.lastSeen > 600) {
      state.active = false; hist.length = 0;
    }
  }

  /* ---------- Geometri (enheter av S; cirkelns mittpunkt i nedre högra hörnet) ---------- */
  const R_FRAME = 0.86;   // rutornas nedre kant följer denna cirkel
  const REF_X   = [0.32, 0.72],  REF_H   = 0.40;   // smal och hög, flyttad åt höger
  const START_X = [0.74, 1],  START_H = 0.20;

  let phaseOuter = 0, phaseInner = 0, last = performance.now(), size = 0;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  function resize() {
    const r = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 3);
    size = r.width;
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);

  // Ruta uppe i hörnet: nedre kanten är lägst av platt höjd och stroboskopets cirkelbåge
  function boxPath(x0, x1, H, S) {
    const lw = 2, inset = lw / 2;
    const bottom = x => {
      const dx = 1 - x;
      const arc = dx < R_FRAME ? 1 - Math.sqrt(R_FRAME * R_FRAME - dx * dx) : H;
      return Math.min(H, arc) * S - inset;
    };
    ctx.beginPath();
    ctx.moveTo(x0 * S + inset, inset);
    ctx.lineTo(x1 * S - inset, inset);
    const N = 24;
    for (let i = 0; i <= N; i++) {
      const x = x1 - (x1 - x0) * i / N;
      ctx.lineTo(clamp(x * S, x0 * S + inset, x1 * S - inset), bottom(x));
    }
    ctx.closePath();
  }

  function ring(cx, cy, rMid, width, n, phase, alpha, glow) {
    const seg = Math.PI * 2 / n;
    ctx.save();
    ctx.lineWidth = width; ctx.strokeStyle = OR; ctx.globalAlpha = alpha;
    if (glow) { ctx.shadowColor = OR; ctx.shadowBlur = size * 0.03; }
    for (let i = 0; i < n; i++) {
      const a0 = phase + i * seg - Math.PI / 2;
      ctx.beginPath(); ctx.arc(cx, cy, rMid, a0, a0 + seg / 2); ctx.stroke();
    }
    ctx.restore();
  }

  function draw(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    detect(now);
    if (!size) resize();
    const S = size, cx = S, cy = S;
    ctx.clearRect(0, 0, S, S);

    // Rutor
    ctx.lineWidth = 2; ctx.strokeStyle = OR; ctx.lineJoin = 'round';
    boxPath(REF_X[0], REF_X[1], REF_H, S); ctx.stroke();
    boxPath(START_X[0], START_X[1], START_H, S);
    if (running) { ctx.fillStyle = OR; ctx.fill(); }
    ctx.stroke();

    // Stroboskop
    const live = state.active, c = live ? state.cents : 0;
    if (live) {
      phaseOuter += clamp(c, -50, 50) * 3 * dt * Math.PI / 180;
      phaseInner += clamp(c, -12, 12) * 15 * dt * Math.PI / 180;
    }
    const inTune = live && Math.abs(c) < 2, alpha = live ? 1 : 0.3;

    ring(cx, cy, S * 0.76, S * 0.14, 12, phaseOuter, alpha, inTune);   // grov skala
    ring(cx, cy, S * 0.60, S * 0.14, 24, phaseInner, alpha, inTune);   // fin skala

    if (inTune) {
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, S * 0.47, Math.PI, Math.PI * 1.5); ctx.closePath();
      ctx.fillStyle = OR; ctx.fill();
    }

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = inTune ? BG : OR; ctx.globalAlpha = live ? 1 : 0.35;
    ctx.font = `${S * 0.2}px ${FONT}`;
    ctx.fillText(live ? NAMES[((state.midi % 12) + 12) % 12] : '–', S * 0.76, S * 0.76);
    ctx.globalAlpha = 1;

    requestAnimationFrame(draw);
  }

  setRef(ref);
  (document.fonts && document.fonts.load ? document.fonts.load(`16px ${FONT}`) : Promise.resolve())
    .catch(() => {}).finally(() => { resize(); requestAnimationFrame(draw); });
})();
</script>
</body>
</html>
